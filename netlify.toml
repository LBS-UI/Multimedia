[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[functions]
  node_bundler = "esbuild"

[functions.tts]
  timeout = 26

[functions.chat]
  timeout = 26
