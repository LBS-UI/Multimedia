name = "multimedia"
main = "worker.js"
compatibility_date = "2025-04-01"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
TTS_REFERENCE_ID = "8d21b053e2804e2a890e1cf62f267b6f"
TTS_MODEL = "s2.1-pro-free"

[[d1_databases]]
binding = "DB"
database_name = "multimedia"
database_id = "58c6da51-94fb-49db-ab3e-8e041cda78d5"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true
